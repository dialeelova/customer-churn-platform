services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: churn_dw
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: churn_dw
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
